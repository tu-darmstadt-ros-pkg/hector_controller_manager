site_name: hector_controller_manager
site_description: A controller manager for ros2_control robots that reconciles requests and faults into one safe step at a time
docs_dir: docs
strict: true
exclude_docs: requirements.txt

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Concepts:
      - Desired and actual state: concepts/reconciler.md
      - The control cycle: concepts/control_cycle.md
      - Sync and async hardware: concepts/async_hardware.md
      - Faults and safety: concepts/faults.md
      - Switches and chains: concepts/switches.md
  - Configuration: configuration.md
  - Interfaces: interfaces.md
  - Migrating from ros2_control: migration.md
  - Testing: testing.md
  - Design (contributors): design.md
